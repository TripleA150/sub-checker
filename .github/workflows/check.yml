name: Check keys

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-keys

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Xray-core
        run: |
          curl -sSL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip xray -d "$RUNNER_TEMP"

      - name: Unit tests
        run: python3 -m unittest test_checker

      - name: Check keys
        run: python3 checker.py sources.txt -o valid.txt --xray "$RUNNER_TEMP/xray"

      - name: Commit result
        run: |
          git config user.name "TripleA150"
          git config user.email "46062533+TripleA150@users.noreply.github.com"
          git add valid.txt
          git diff --cached --quiet || { git commit -m "Update valid keys" && git push; }
